name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          major="$(xcodebuild -version | awk '/^Xcode / {split($2, parts, "."); print parts[1]}')"
          test "$major" -ge 26
          xcodebuild -showsdks | grep -E 'iphoneos26\.'

      - name: Archive for iOS device
        run: |
          xcodebuild \
            -project ByCSLernclient.xcodeproj \
            -scheme ByCSLernclient \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ByCSLernclient.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          app="$RUNNER_TEMP/ByCSLernclient.xcarchive/Products/Applications/ByCSLernclient.app"
          test -d "$app"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$app" "$RUNNER_TEMP/package/Payload/"
          cd "$RUNNER_TEMP/package"
          zip -qry "$GITHUB_WORKSPACE/ByCSLernclient-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ByCSLernclient-unsigned-ipa
          path: ByCSLernclient-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
